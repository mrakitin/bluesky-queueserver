[workspace]
name = "bluesky-queueserver"
version = "0.0.1"
description = "Server for queueing plans"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
pip = "*"
pyqt = "*"

[pypi-dependencies]
bluesky = ">=1.7.0"
ipykernel = "*"
jsonschema = "*"
jupyter-client = ">=7.4.2"
jupyter-console = "*"
numpydoc = "*"
openpyxl = "*"
ophyd = "*"
packaging = "*"
pydantic = "*"
python-multipart = "*"
pyyaml = "*"
pyzmq = "*"
redis = {version = "*", extras = ["hiredis"]}
requests = "*"
fastmcp = "*"
bluesky-queueserver-api = "*"
bluesky-tiled-plugins = "*"

[feature.dev.pypi-dependencies]
black = "!=25.11.0"
coverage = "*"
flake8 = "*"
isort = "*"
happi = ">=1.14.0"
pre-commit = "*"
pytest = "*"
pytest-xprocess = "*"
pytest-split = "*"
py = "*"
sphinx = "*"
ipython = "*"
matplotlib = "*"
numpy = "*"
intake = "*"
scikit-image = "*"
sphinx-rtd-theme = "*"
fastapi = {version = "*", extras = ["all"]}
pandas = "*"
pyarrow = "*"
h5py = "*"
ophyd-async = "*"

[environments]
default = {features = ["dev"], solve-group = "default"}

[tasks]
install = "pip install --no-build-isolation -e ."
start-re-manager = "start-re-manager --zmq-publish-console ON --startup-dir bluesky_queueserver/profile_collection_sim"
start-tiled-server = {cmd = "tiled catalog serve tiled/catalog.db --init --public --write ./tiled/data --write sqlite:///./tiled/tables.db --host 127.0.0.1 --port 8000 --api-key bluesky", env = {TILED_API_KEY = "bluesky"}}
queue-monitor = "queue-monitor"
mcp-server = "bluesky-mcp-server"
mcp-inspector = {cmd = "fastmcp dev inspector bluesky_queueserver/mcp_server/app.py", env = {HOST = "127.0.0.1"}}
mcp-chat = "python -m bluesky_queueserver.mcp_server.chat"
tiled-mcp-server = "bluesky-tiled-mcp-server"
tiled-mcp-inspector = {cmd = "fastmcp dev inspector bluesky_queueserver/tiled_mcp_server/app.py", env = {HOST = "127.0.0.1"}}
